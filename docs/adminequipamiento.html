<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMINISTRAR EQUIPAMIENTO - WISBE</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-db.js"></script>
</head>
<body>
  <main class="subpage-container">
    <header class="subpage-header">
      <h1 class="subpage-title">
        EQUIPAMIENTO <span class="subpage-title-badge">ADMIN</span>
      </h1>
      <div>
        <a href="admin.html" class="btn-back">VOLVER AL PANEL</a>
      </div>
    </header>

    <div class="actions-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar por nombre o estado...">
      <button id="add-btn" class="btn-add">NUEVO EQUIPO</button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Estado</th>
            <th>Fecha Adquisición</th>
            <th>Próximo Mantenimiento</th>
            <th style="width: 150px;">Acciones</th>
          </tr>
        </thead>
        <tbody id="data-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Create/Edit Modal -->
  <div id="crud-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title" class="modal-header">Nuevo Equipo</h2>
      <form id="crud-form">
        <input type="hidden" id="row-id">
        <div class="form-group">
          <label for="form-nombre">Nombre de Equipo</label>
          <input type="text" id="form-nombre" required placeholder="Caminadora Proform 500">
        </div>
        <div class="form-group">
          <label for="form-estado">Estado</label>
          <select id="form-estado">
            <option value="Excelente">Excelente</option>
            <option value="Bueno">Bueno</option>
            <option value="Regular">Regular</option>
            <option value="En Mantenimiento">En Mantenimiento</option>
          </select>
        </div>
        <div class="form-group">
          <label for="form-adquisicion">Fecha Adquisición</label>
          <input type="date" id="form-adquisicion" required>
        </div>
        <div class="form-group">
          <label for="form-mantenimiento">Próximo Mantenimiento</label>
          <input type="date" id="form-mantenimiento" required>
        </div>
        <div class="modal-actions">
          <button type="button" id="close-modal-btn" class="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allData = [];
    async function loadData() {
      allData = await DB.get('equipamiento');
      renderTable(allData);
    }

    function renderTable(data) {
      const tbody = document.getElementById('data-table-body');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No hay registros encontrados.</td></tr>';
        return;
      }
      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.id}</td>
          <td>${row.nombre}</td>
          <td><span class="subpage-title-badge">${row.estado}</span></td>
          <td>${row.fecha_adquisicion}</td>
          <td>${row.proximo_mantenimiento || 'N/A'}</td>
          <td>
            <button class="btn-edit" onclick="openEditModal(${row.id})">Editar</button>
            <button class="btn-delete" onclick="deleteRow(${row.id})">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allData.filter(row =>
        row.nombre.toLowerCase().includes(query) ||
        row.estado.toLowerCase().includes(query)
      );
      renderTable(filtered);
    });

    const modal = document.getElementById('crud-modal');
    const crudForm = document.getElementById('crud-form');

    document.getElementById('add-btn').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = 'Nuevo Equipo';
      document.getElementById('row-id').value = '';
      crudForm.reset();

      const now = new Date();
      document.getElementById('form-adquisicion').value = now.toISOString().split('T')[0];

      const nextMaint = new Date();
      nextMaint.setMonth(nextMaint.getMonth() + 6);
      document.getElementById('form-mantenimiento').value = nextMaint.toISOString().split('T')[0];

      modal.classList.add('active');
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    function openEditModal(id) {
      const row = allData.find(r => r.id === id);
      if (!row) return;
      document.getElementById('modal-title').textContent = 'Editar Equipo';
      document.getElementById('row-id').value = row.id;
      document.getElementById('form-nombre').value = row.nombre;
      document.getElementById('form-estado').value = row.estado;
      document.getElementById('form-adquisicion').value = row.fecha_adquisicion;
      document.getElementById('form-mantenimiento').value = row.proximo_mantenimiento || '';
      modal.classList.add('active');
    }

    crudForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('row-id').value;
      const rowData = {
        nombre: document.getElementById('form-nombre').value,
        estado: document.getElementById('form-estado').value,
        fecha_adquisicion: document.getElementById('form-adquisicion').value,
        proximo_mantenimiento: document.getElementById('form-mantenimiento').value
      };

      if (id) {
        await DB.update('equipamiento', id, rowData);
      } else {
        await DB.insert('equipamiento', rowData);
      }
      modal.classList.remove('active');
      loadData();
    });

    async function deleteRow(id) {
      if (confirm('¿Está seguro de que desea eliminar este equipamiento?')) {
        await DB.delete('equipamiento', id);
        loadData();
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
