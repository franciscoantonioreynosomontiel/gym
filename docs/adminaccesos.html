<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMINISTRAR ACCESOS - WISBE</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-db.js"></script>
</head>
<body>
  <main class="subpage-container">
    <header class="subpage-header">
      <h1 class="subpage-title">
        ACCESOS <span class="subpage-title-badge">ADMIN</span>
      </h1>
      <div>
        <a href="admin.html" class="btn-back">VOLVER AL PANEL</a>
      </div>
    </header>

    <div class="actions-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar por ID de cliente...">
      <button id="add-btn" class="btn-add">REGISTRAR ACCESO</button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente ID</th>
            <th>Fecha / Hora</th>
            <th>Tipo Acceso</th>
            <th style="width: 150px;">Acciones</th>
          </tr>
        </thead>
        <tbody id="data-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Create/Edit Modal -->
  <div id="crud-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title" class="modal-header">Registrar Acceso</h2>
      <form id="crud-form">
        <input type="hidden" id="row-id">
        <div class="form-group">
          <label for="form-cliente">Cliente ID</label>
          <input type="number" id="form-cliente" required placeholder="1">
        </div>
        <div class="form-group">
          <label for="form-fecha">Fecha / Hora</label>
          <input type="text" id="form-fecha" required placeholder="YYYY-MM-DD HH:MM:SS">
        </div>
        <div class="form-group">
          <label for="form-tipo">Tipo de Acceso</label>
          <select id="form-tipo">
            <option value="Entrada">Entrada</option>
            <option value="Salida">Salida</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" id="close-modal-btn" class="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allData = [];
    async function loadData() {
      allData = await DB.get('accesos');
      renderTable(allData);
    }

    function renderTable(data) {
      const tbody = document.getElementById('data-table-body');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No hay registros encontrados.</td></tr>';
        return;
      }
      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.id}</td>
          <td>Cliente #${row.cliente_id}</td>
          <td>${row.fecha_hora}</td>
          <td><span class="subpage-title-badge">${row.tipo_acceso}</span></td>
          <td>
            <button class="btn-edit" onclick="openEditModal(${row.id})">Editar</button>
            <button class="btn-delete" onclick="deleteRow(${row.id})">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value;
      const filtered = allData.filter(row =>
        String(row.cliente_id).includes(query)
      );
      renderTable(filtered);
    });

    const modal = document.getElementById('crud-modal');
    const crudForm = document.getElementById('crud-form');

    document.getElementById('add-btn').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = 'Registrar Acceso';
      document.getElementById('row-id').value = '';
      crudForm.reset();

      const now = new Date();
      const formatStr = now.toISOString().replace('T', ' ').substring(0, 19);
      document.getElementById('form-fecha').value = formatStr;
      modal.classList.add('active');
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    function openEditModal(id) {
      const row = allData.find(r => r.id === id);
      if (!row) return;
      document.getElementById('modal-title').textContent = 'Editar Acceso';
      document.getElementById('row-id').value = row.id;
      document.getElementById('form-cliente').value = row.cliente_id;
      document.getElementById('form-fecha').value = row.fecha_hora;
      document.getElementById('form-tipo').value = row.tipo_acceso;
      modal.classList.add('active');
    }

    crudForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('row-id').value;
      const rowData = {
        cliente_id: parseInt(document.getElementById('form-cliente').value),
        fecha_hora: document.getElementById('form-fecha').value,
        tipo_acceso: document.getElementById('form-tipo').value
      };

      if (id) {
        await DB.update('accesos', id, rowData);
      } else {
        await DB.insert('accesos', rowData);
      }
      modal.classList.remove('active');
      loadData();
    });

    async function deleteRow(id) {
      if (confirm('¿Está seguro de que desea eliminar este acceso?')) {
        await DB.delete('accesos', id);
        loadData();
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
