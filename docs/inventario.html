<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>INVENTARIO - WISBE</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-db.js"></script>
</head>
<body>
  <main class="subpage-container">
    <header class="subpage-header">
      <h1 class="subpage-title">INVENTARIO</h1>
      <a href="index.html" class="btn-back">VOLVER</a>
    </header>

    <div class="actions-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar por ID de producto...">
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Producto ID</th>
            <th>Cantidad Movimiento</th>
            <th>Tipo Movimiento</th>
            <th>Fecha</th>
          </tr>
        </thead>
        <tbody id="data-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>
  </main>

  <script>
    let allData = [];
    async function loadData() {
      allData = await DB.get('inventario');
      renderTable(allData);
    }

    function renderTable(data) {
      const tbody = document.getElementById('data-table-body');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No hay registros encontrados.</td></tr>';
        return;
      }
      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.id}</td>
          <td>Producto #${row.producto_id}</td>
          <td>${row.cantidad_movimiento} unidades</td>
          <td><span class="subpage-title-badge">${row.tipo_movimiento}</span></td>
          <td>${row.fecha_movimiento}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value;
      const filtered = allData.filter(row =>
        String(row.producto_id).includes(query)
      );
      renderTable(filtered);
    });

    window.onload = loadData;
  </script>
</body>
</html>
