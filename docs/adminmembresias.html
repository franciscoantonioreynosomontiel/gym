<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMINISTRAR MEMBRESÍAS - WISBE</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-db.js"></script>
</head>
<body>
  <main class="subpage-container">
    <header class="subpage-header">
      <h1 class="subpage-title">
        MEMBRESÍAS <span class="subpage-title-badge">ADMIN</span>
      </h1>
      <div>
        <a href="admin.html" class="btn-back">VOLVER AL PANEL</a>
      </div>
    </header>

    <div class="actions-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar por ID de cliente...">
      <button id="add-btn" class="btn-add">NUEVA MEMBRESÍA</button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Cliente ID</th>
            <th>Plan ID</th>
            <th>Fecha Inicio</th>
            <th>Fecha Fin</th>
            <th>Estado</th>
            <th style="width: 150px;">Acciones</th>
          </tr>
        </thead>
        <tbody id="data-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Create/Edit Modal -->
  <div id="crud-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title" class="modal-header">Nueva Membresía</h2>
      <form id="crud-form">
        <input type="hidden" id="row-id">
        <div class="form-group">
          <label for="form-cliente">Cliente ID</label>
          <input type="number" id="form-cliente" required placeholder="1">
        </div>
        <div class="form-group">
          <label for="form-plan">Plan ID</label>
          <input type="number" id="form-plan" required placeholder="1">
        </div>
        <div class="form-group">
          <label for="form-inicio">Fecha Inicio</label>
          <input type="date" id="form-inicio" required>
        </div>
        <div class="form-group">
          <label for="form-fin">Fecha Fin</label>
          <input type="date" id="form-fin" required>
        </div>
        <div class="form-group">
          <label for="form-estado">Estado</label>
          <select id="form-estado">
            <option value="Activa">Activa</option>
            <option value="Vencida">Vencida</option>
            <option value="Cancelada">Cancelada</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" id="close-modal-btn" class="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allData = [];
    async function loadData() {
      allData = await DB.get('membresias');
      renderTable(allData);
    }

    function renderTable(data) {
      const tbody = document.getElementById('data-table-body');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No hay registros encontrados.</td></tr>';
        return;
      }
      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.id}</td>
          <td>Cliente #${row.cliente_id}</td>
          <td>Plan #${row.plan_id}</td>
          <td>${row.fecha_inicio}</td>
          <td>${row.fecha_fin}</td>
          <td><span class="subpage-title-badge">${row.estado}</span></td>
          <td>
            <button class="btn-edit" onclick="openEditModal(${row.id})">Editar</button>
            <button class="btn-delete" onclick="deleteRow(${row.id})">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allData.filter(row =>
        String(row.cliente_id).includes(query)
      );
      renderTable(filtered);
    });

    const modal = document.getElementById('crud-modal');
    const crudForm = document.getElementById('crud-form');

    document.getElementById('add-btn').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = 'Nueva Membresía';
      document.getElementById('row-id').value = '';
      crudForm.reset();
      document.getElementById('form-inicio').value = new Date().toISOString().split('T')[0];
      const nextMonth = new Date();
      nextMonth.setMonth(nextMonth.getMonth() + 1);
      document.getElementById('form-fin').value = nextMonth.toISOString().split('T')[0];
      modal.classList.add('active');
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    function openEditModal(id) {
      const row = allData.find(r => r.id === id);
      if (!row) return;
      document.getElementById('modal-title').textContent = 'Editar Membresía';
      document.getElementById('row-id').value = row.id;
      document.getElementById('form-cliente').value = row.cliente_id;
      document.getElementById('form-plan').value = row.plan_id;
      document.getElementById('form-inicio').value = row.fecha_inicio;
      document.getElementById('form-fin').value = row.fecha_fin;
      document.getElementById('form-estado').value = row.estado;
      modal.classList.add('active');
    }

    crudForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('row-id').value;
      const rowData = {
        cliente_id: parseInt(document.getElementById('form-cliente').value),
        plan_id: parseInt(document.getElementById('form-plan').value),
        fecha_inicio: document.getElementById('form-inicio').value,
        fecha_fin: document.getElementById('form-fin').value,
        estado: document.getElementById('form-estado').value
      };

      if (id) {
        await DB.update('membresias', id, rowData);
      } else {
        await DB.insert('membresias', rowData);
      }
      modal.classList.remove('active');
      loadData();
    });

    async function deleteRow(id) {
      if (confirm('¿Está seguro de que desea eliminar esta membresía?')) {
        await DB.delete('membresias', id);
        loadData();
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
