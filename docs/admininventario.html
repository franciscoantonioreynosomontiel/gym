<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMINISTRAR INVENTARIO - WISBE</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-db.js"></script>
</head>
<body>
  <main class="subpage-container">
    <header class="subpage-header">
      <h1 class="subpage-title">
        INVENTARIO <span class="subpage-title-badge">ADMIN</span>
      </h1>
      <div>
        <a href="admin.html" class="btn-back">VOLVER AL PANEL</a>
      </div>
    </header>

    <div class="actions-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar por ID de producto...">
      <button id="add-btn" class="btn-add">NUEVO MOVIMIENTO</button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Producto ID</th>
            <th>Cantidad Movimiento</th>
            <th>Tipo Movimiento</th>
            <th>Fecha</th>
            <th style="width: 150px;">Acciones</th>
          </tr>
        </thead>
        <tbody id="data-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Create/Edit Modal -->
  <div id="crud-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title" class="modal-header">Nuevo Movimiento de Inventario</h2>
      <form id="crud-form">
        <input type="hidden" id="row-id">
        <div class="form-group">
          <label for="form-producto">Producto ID</label>
          <input type="number" id="form-producto" required placeholder="1">
        </div>
        <div class="form-group">
          <label for="form-cantidad">Cantidad</label>
          <input type="number" id="form-cantidad" required placeholder="10">
        </div>
        <div class="form-group">
          <label for="form-tipo">Tipo de Movimiento</label>
          <select id="form-tipo">
            <option value="Entrada">Entrada</option>
            <option value="Salida">Salida</option>
            <option value="Ajuste">Ajuste</option>
          </select>
        </div>
        <div class="form-group">
          <label for="form-fecha">Fecha Movimiento</label>
          <input type="date" id="form-fecha" required>
        </div>
        <div class="modal-actions">
          <button type="button" id="close-modal-btn" class="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allData = [];
    async function loadData() {
      allData = await DB.get('inventario');
      renderTable(allData);
    }

    function renderTable(data) {
      const tbody = document.getElementById('data-table-body');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No hay registros encontrados.</td></tr>';
        return;
      }
      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.id}</td>
          <td>Producto #${row.producto_id}</td>
          <td>${row.cantidad_movimiento} unidades</td>
          <td><span class="subpage-title-badge">${row.tipo_movimiento}</span></td>
          <td>${row.fecha_movimiento}</td>
          <td>
            <button class="btn-edit" onclick="openEditModal(${row.id})">Editar</button>
            <button class="btn-delete" onclick="deleteRow(${row.id})">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value;
      const filtered = allData.filter(row =>
        String(row.producto_id).includes(query)
      );
      renderTable(filtered);
    });

    const modal = document.getElementById('crud-modal');
    const crudForm = document.getElementById('crud-form');

    document.getElementById('add-btn').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = 'Nuevo Movimiento';
      document.getElementById('row-id').value = '';
      crudForm.reset();
      document.getElementById('form-fecha').value = new Date().toISOString().split('T')[0];
      modal.classList.add('active');
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    function openEditModal(id) {
      const row = allData.find(r => r.id === id);
      if (!row) return;
      document.getElementById('modal-title').textContent = 'Editar Movimiento';
      document.getElementById('row-id').value = row.id;
      document.getElementById('form-producto').value = row.producto_id;
      document.getElementById('form-cantidad').value = row.cantidad_movimiento;
      document.getElementById('form-tipo').value = row.tipo_movimiento;
      document.getElementById('form-fecha').value = row.fecha_movimiento.split(' ')[0];
      modal.classList.add('active');
    }

    crudForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('row-id').value;
      const rowData = {
        producto_id: parseInt(document.getElementById('form-producto').value),
        cantidad_movimiento: parseInt(document.getElementById('form-cantidad').value),
        tipo_movimiento: document.getElementById('form-tipo').value,
        fecha_movimiento: document.getElementById('form-fecha').value
      };

      if (id) {
        await DB.update('inventario', id, rowData);
      } else {
        await DB.insert('inventario', rowData);
      }
      modal.classList.remove('active');
      loadData();
    });

    async function deleteRow(id) {
      if (confirm('¿Está seguro de que desea eliminar este movimiento?')) {
        await DB.delete('inventario', id);
        loadData();
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
