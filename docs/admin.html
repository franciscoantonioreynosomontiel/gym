<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="stylesheet" href="css/styles.css">
  <script src="js/supabase-db.js"></script>
</head>
<body>

    <div class="brand-header">
      <img src="logo.png" alt="Wisbe Logo" class="brand-logo-small">
    </div>
    <button id="logout-btn" class="btn-logout">SALIR</button>
  </header>

  <main class="container">
    <div class="grid">
      <a href="adminclientes.html" class="tile" tabindex="0">

      <a href="adminmembresias.html" class="tile" tabindex="0">
        <h2>MEMBRESÍAS</h2>
      </a>
      <a href="adminpagos.html" class="tile" tabindex="0">
        <h2>PAGOS</h2>
      </a>
      <a href="adminaccesos.html" class="tile" tabindex="0">
        <h2>ACCESOS</h2>
      </a>
      <a href="adminplanes.html" class="tile" tabindex="0">

      </a>
      <a href="adminentrenadores.html" class="tile" tabindex="0">

      </a>
      <a href="admininventario.html" class="tile" tabindex="0">

      </a>
      <a href="admingastos.html" class="tile" tabindex="0">
        <h2>GASTOS</h2>
      </a>
      <a href="adminempleados.html" class="tile" tabindex="0">
        <h2>EMPLEADOS</h2>
      </a>
      <a href="adminequipamiento.html" class="tile" tabindex="0">
        <h2>EQUIPAMIENTO</h2>
      </a>
    </div>
  </main>

  <script>
    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('wisbe_admin_logged_in');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
