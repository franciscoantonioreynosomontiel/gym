<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMINISTRAR PRODUCTOS - WISBE</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-db.js"></script>
</head>
<body>
  <main class="subpage-container">
    <header class="subpage-header">
      <h1 class="subpage-title">
        PRODUCTOS <span class="subpage-title-badge">ADMIN</span>
      </h1>
      <div>
        <a href="admin.html" class="btn-back">VOLVER AL PANEL</a>
      </div>
    </header>

    <div class="actions-bar">
      <input type="text" id="search-input" class="search-input" placeholder="Buscar por nombre o barras...">
      <button id="add-btn" class="btn-add">NUEVO PRODUCTO</button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Código Barras</th>
            <th style="width: 150px;">Acciones</th>
          </tr>
        </thead>
        <tbody id="data-table-body">
          <!-- Dynamically populated -->
        </tbody>
      </table>
    </div>
  </main>

  <!-- Create/Edit Modal -->
  <div id="crud-modal" class="modal">
    <div class="modal-content">
      <h2 id="modal-title" class="modal-header">Nuevo Producto</h2>
      <form id="crud-form">
        <input type="hidden" id="row-id">
        <div class="form-group">
          <label for="form-nombre">Nombre de Producto</label>
          <input type="text" id="form-nombre" required placeholder="Bebida Energizante">
        </div>
        <div class="form-group">
          <label for="form-precio">Precio ($)</label>
          <input type="number" step="0.01" id="form-precio" required placeholder="35.00">
        </div>
        <div class="form-group">
          <label for="form-stock">Stock</label>
          <input type="number" id="form-stock" required placeholder="50" value="0">
        </div>
        <div class="form-group">
          <label for="form-barras">Código de Barras</label>
          <input type="text" id="form-barras" placeholder="7509876543210">
        </div>
        <div class="modal-actions">
          <button type="button" id="close-modal-btn" class="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-submit">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let allData = [];
    async function loadData() {
      allData = await DB.get('productos');
      renderTable(allData);
    }

    function renderTable(data) {
      const tbody = document.getElementById('data-table-body');
      tbody.innerHTML = '';
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No hay registros encontrados.</td></tr>';
        return;
      }
      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${row.id}</td>
          <td>${row.nombre}</td>
          <td>$${row.precio}</td>
          <td>${row.stock} uds</td>
          <td>${row.codigo_barras || ''}</td>
          <td>
            <button class="btn-edit" onclick="openEditModal(${row.id})">Editar</button>
            <button class="btn-delete" onclick="deleteRow(${row.id})">Eliminar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allData.filter(row =>
        row.nombre.toLowerCase().includes(query) ||
        (row.codigo_barras && row.codigo_barras.includes(query))
      );
      renderTable(filtered);
    });

    const modal = document.getElementById('crud-modal');
    const crudForm = document.getElementById('crud-form');

    document.getElementById('add-btn').addEventListener('click', () => {
      document.getElementById('modal-title').textContent = 'Nuevo Producto';
      document.getElementById('row-id').value = '';
      crudForm.reset();
      document.getElementById('form-stock').value = '0';
      modal.classList.add('active');
    });

    document.getElementById('close-modal-btn').addEventListener('click', () => {
      modal.classList.remove('active');
    });

    function openEditModal(id) {
      const row = allData.find(r => r.id === id);
      if (!row) return;
      document.getElementById('modal-title').textContent = 'Editar Producto';
      document.getElementById('row-id').value = row.id;
      document.getElementById('form-nombre').value = row.nombre;
      document.getElementById('form-precio').value = row.precio;
      document.getElementById('form-stock').value = row.stock;
      document.getElementById('form-barras').value = row.codigo_barras || '';
      modal.classList.add('active');
    }

    crudForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('row-id').value;
      const rowData = {
        nombre: document.getElementById('form-nombre').value,
        precio: parseFloat(document.getElementById('form-precio').value),
        stock: parseInt(document.getElementById('form-stock').value),
        codigo_barras: document.getElementById('form-barras').value
      };

      if (id) {
        await DB.update('productos', id, rowData);
      } else {
        await DB.insert('productos', rowData);
      }
      modal.classList.remove('active');
      loadData();
    });

    async function deleteRow(id) {
      if (confirm('¿Está seguro de que desea eliminar este producto?')) {
        await DB.delete('productos', id);
        loadData();
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
