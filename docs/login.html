<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCESO ADMINISTRADOR</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="login-container">
    <div class="brand-header">
      <img src="logo.png" alt="Wisbe" class="brand-logo">
    </div>

    <form id="login-form" class="login-form">
      <div class="form-group">
        <label for="username">Usuario / Correo Electrónico</label>
        <input type="text" id="username" required placeholder="Antonio" value="Antonio">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" value="123">
      </div>
      <div id="login-error" class="error-msg" style="display: none;">Credenciales incorrectas. Intente nuevamente.</div>
      <button type="submit" class="btn-primary">ENTRAR</button>
      <a href="index.html" class="btn-secondary">VOLVER AL PORTAL PÚBLICO</a>
    </form>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();

      // Simple credentials check for Antonio / 123
      if ((username === 'Antonio' || username === 'admin@wisbe.com') && (password === '123' || password === 'admin123')) {
        localStorage.setItem('wisbe_admin_logged_in', 'true');
        window.location.href = 'admin.html';
      } else {
        const errorEl = document.getElementById('login-error');
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
