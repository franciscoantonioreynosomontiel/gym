<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ACCESO ADMINISTRADOR</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="login-container">
    <div class="brand-header">
      <img src="logo.png" alt="Wisbe" class="brand-logo">
    </div>

    <form id="login-form" class="login-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="admin@wisbe.com" value="admin@wisbe.com">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" value="admin123">
      </div>
      <div id="login-error" class="error-msg" style="display: none;">Credenciales incorrectas. Intente nuevamente.</div>
      <button type="submit" class="btn-primary">ENTRAR</button>
      <a href="index.html" class="btn-secondary">VOLVER AL PORTAL PÚBLICO</a>
    </form>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      // Real or Mocked authentication: accept admin@wisbe.com / admin123
      if (email === 'admin@wisbe.com' && password === 'admin123') {
        localStorage.setItem('wisbe_admin_logged_in', 'true');
        window.location.href = 'admin.html';
      } else {
        const errorEl = document.getElementById('login-error');
        errorEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
