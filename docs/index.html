<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTAL WISBE</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="portal-header">
    <div class="brand-header">
      <img src="logo.png" alt="Wisbe Logo" class="brand-logo-small">
    </div>
    <a href="login.html" id="admin-btn" class="btn-back">ADMINISTRACIÓN</a>
  </header>

  <main class="container">
    <div class="grid">
      <a href="clientes.html" class="tile" tabindex="0">
        <h2>CLIENTES</h2>
      </a>
      <a href="membresias.html" class="tile" tabindex="0">
        <h2>MEMBRESÍAS</h2>
      </a>
      <a href="pagos.html" class="tile" tabindex="0">
        <h2>PAGOS</h2>
      </a>
      <a href="accesos.html" class="tile" tabindex="0">
        <h2>ACCESOS</h2>
      </a>
      <a href="planes.html" class="tile" tabindex="0">
        <h2>PLANES</h2>
      </a>
      <a href="entrenadores.html" class="tile" tabindex="0">
        <h2>ENTRENADORES</h2>
      </a>
      <a href="clases.html" class="tile" tabindex="0">
        <h2>CLASES</h2>
      </a>
      <a href="reservaciones.html" class="tile" tabindex="0">
        <h2>RESERVACIONES</h2>
      </a>
      <a href="productos.html" class="tile" tabindex="0">
        <h2>PRODUCTOS</h2>
      </a>
      <a href="inventario.html" class="tile" tabindex="0">
        <h2>INVENTARIO</h2>
      </a>
      <a href="gastos.html" class="tile" tabindex="0">
        <h2>GASTOS</h2>
      </a>
      <a href="empleados.html" class="tile" tabindex="0">
        <h2>EMPLEADOS</h2>
      </a>
      <a href="equipamiento.html" class="tile" tabindex="0">
        <h2>EQUIPAMIENTO</h2>
      </a>
    </div>
  </main>

  <script>
    // If admin is already logged in, change the link to directly go to admin.html
    document.addEventListener("DOMContentLoaded", () => {
      const isAdmin = localStorage.getItem("wisbe_admin_logged_in") === "true";
      if (isAdmin) {
        const btn = document.getElementById("admin-btn");
        btn.textContent = "PANEL DE CONTROL";
        btn.href = "admin.html";
      }
    });
  </script>
</body>
</html>
